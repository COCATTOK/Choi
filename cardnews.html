<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카드뉴스 자동생성기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #4f46e5;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --panel: #1b1e25;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --line: #2d313b;
        --accent: #818cf8;
        --accent-text: #111318;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 20px; }
    header a { color: var(--muted); font-size: 14px; }
    main {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      align-self: start;
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 16px 0 6px;
    }
    label:first-child { margin-top: 0; }
    .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
    input[type=text], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }
    textarea { min-height: 260px; resize: vertical; line-height: 1.6; }
    textarea.short { min-height: 100px; }
    .ai {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      background: var(--bg);
    }
    .ai summary { cursor: pointer; font-weight: 700; font-size: 14px; }
    .ai p.hint { margin: 10px 0 0; line-height: 1.5; }
    .ai input[type=text], .ai textarea, .ai select { background: var(--panel); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .themes { display: flex; flex-wrap: wrap; gap: 8px; }
    .theme-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      padding: 0;
    }
    .theme-btn[aria-pressed=true] { border-color: var(--text); }
    .check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 12px; }
    button.primary, button.ghost {
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: var(--accent-text); border: 0; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .actions button { flex: 1; }
    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }
    .preview-head h2 { margin: 0; font-size: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }
    .card canvas { width: 100%; height: auto; display: block; border-radius: 6px; }
    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .card-foot button { padding: 6px 10px; font-size: 12px; }

    /* ---------- 게시물 미리보기 ---------- */
    .post-area {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .post {
      width: 400px;
      max-width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      font-size: 14px;
    }
    .post-top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      font-size: 15px;
      flex: none;
    }
    .post-name { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .post-media { position: relative; background: #000; }
    .track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .track::-webkit-scrollbar { display: none; }
    .track canvas { flex: 0 0 100%; width: 100%; height: auto; display: block; scroll-snap-align: start; }
    .badge {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.6); color: #fff;
      font-size: 12px; padding: 3px 9px; border-radius: 999px;
    }
    .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px; border-radius: 50%;
      border: 0; background: rgba(255,255,255,0.85); color: #111;
      font-size: 16px; line-height: 1; cursor: pointer;
    }
    .nav:disabled { display: none; }
    .nav.prev { left: 10px; }
    .nav.next { right: 10px; }
    .post-actions { display: flex; align-items: center; padding: 8px 12px 4px; gap: 14px; }
    .post-actions svg { width: 24px; height: 24px; }
    .dots { flex: 1; display: flex; justify-content: center; gap: 4px; }
    .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .dots span.on { background: var(--accent); }
    .post-caption { padding: 4px 12px 0; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .post-caption.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .post-caption .tag { color: #3b82f6; }
    .more { border: 0; background: none; color: var(--muted); padding: 2px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    .post-time { color: var(--muted); font-size: 11px; padding: 6px 12px 14px; }
    .publish {
      flex: 1;
      min-width: 240px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
    }
    .publish h3 { margin: 0 0 6px; font-size: 15px; }
    .publish p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .publish button { width: 100%; margin-top: 8px; }
    .stat { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .stat.warn { color: #dc2626; }
    @media (max-width: 860px) {
      main { grid-template-columns: minmax(0, 1fr); padding: 16px; }
      .panel { position: static; max-height: none; }
      header { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>카드뉴스 자동생성기</h1>
    <a href="index.html">← 홈으로</a>
  </header>

  <main>
    <section class="panel">
      <details class="ai" id="ai">
        <summary>AI로 원고 만들기</summary>
        <p class="hint">① 조건 입력 → ② 프롬프트 복사 후 ChatGPT·Claude 등에 붙여넣기 → ③ 답변을 아래에 붙여넣고 적용</p>

        <label for="aiTopic">주제</label>
        <input type="text" id="aiTopic" placeholder="예: 초보자를 위한 HTML·CSS·JS 차이">

        <div class="row">
          <div>
            <label for="aiAudience">대상 독자</label>
            <input type="text" id="aiAudience" value="20~30대 입문자">
          </div>
          <div>
            <label for="aiCount">내용 카드 수</label>
            <select id="aiCount">
              <option>3</option><option>4</option><option selected>5</option>
              <option>6</option><option>7</option><option>8</option>
            </select>
          </div>
        </div>

        <label for="aiTone">말투</label>
        <select id="aiTone">
          <option value="친근한 존댓말 (~해요)">친근한 존댓말 (~해요)</option>
          <option value="격식 있는 존댓말 (~합니다)">격식 있는 존댓말 (~합니다)</option>
          <option value="친구 같은 반말 (~해)">친구 같은 반말 (~해)</option>
          <option value="간결한 뉴스 요약체 (~함, ~임)">간결한 뉴스 요약체 (~함, ~임)</option>
        </select>

        <label for="aiSource">참고 자료 <span class="hint">(선택 · 기사, 메모 등)</span></label>
        <textarea id="aiSource" class="short" placeholder="여기에 넣은 내용을 바탕으로만 수치·사실을 씁니다"></textarea>

        <div class="actions">
          <button class="primary" id="copyPrompt" type="button">프롬프트 복사</button>
        </div>

        <label for="aiResult">AI 답변 붙여넣기</label>
        <textarea id="aiResult" class="short" placeholder="[표지 제목]으로 시작하는 답변 전체를 붙여넣으세요"></textarea>
        <div class="actions">
          <button class="ghost" id="applyResult" type="button">카드에 적용</button>
        </div>
        <p class="hint" id="aiMsg" role="status"></p>
      </details>

      <label for="brand">계정 / 브랜드명</label>
      <input type="text" id="brand" value="@choi_news">

      <label for="title">표지 제목</label>
      <input type="text" id="title" value="오늘 알아두면 좋은 웹 기초 3가지">

      <label for="subtitle">표지 부제</label>
      <input type="text" id="subtitle" value="처음 코딩을 시작하는 사람을 위한 요약">

      <label for="body">본문 <span class="hint">— 빈 줄로 카드 구분 · 첫 줄은 소제목 · "- "로 시작하면 목록</span></label>
      <textarea id="body"></textarea>

      <label for="cta">마지막 카드 문구</label>
      <input type="text" id="cta" value="도움이 됐다면 저장하고 팔로우해 주세요!">

      <label for="caption">게시글 캡션 <span class="hint">— 해시태그 포함, 게시물 아래에 붙는 글</span></label>
      <textarea id="caption" class="short"></textarea>
      <div class="actions">
        <button class="ghost" id="autoCaption" type="button">카드 내용으로 캡션 자동 작성</button>
      </div>

      <label>테마</label>
      <div class="themes" id="themes"></div>

      <div class="row">
        <div>
          <label for="ratio">비율</label>
          <select id="ratio">
            <option value="1080">1:1 (정사각형)</option>
            <option value="1350" selected>4:5 (인스타 세로)</option>
            <option value="1920">9:16 (스토리)</option>
          </select>
        </div>
        <div>
          <label for="size">글자 크기</label>
          <select id="size">
            <option value="0.85">작게</option>
            <option value="1" selected>보통</option>
            <option value="1.15">크게</option>
          </select>
        </div>
      </div>

      <label for="bgimg">표지 배경 이미지 <span class="hint">(선택)</span></label>
      <input type="file" id="bgimg" accept="image/*">

      <div class="check"><input type="checkbox" id="showCover" checked><label for="showCover" style="margin:0;font-weight:400">표지 카드 포함</label></div>
      <div class="check"><input type="checkbox" id="showEnd" checked><label for="showEnd" style="margin:0;font-weight:400">마지막 카드 포함</label></div>

      <div class="actions">
        <button class="ghost" id="clearImg" type="button">배경 이미지 제거</button>
        <button class="ghost" id="sample" type="button">예시 불러오기</button>
      </div>
    </section>

    <section>
      <div class="preview-head">
        <h2>게시물 미리보기</h2>
      </div>
      <div class="post-area">
        <article class="post" aria-label="게시물 미리보기">
          <div class="post-top">
            <div class="avatar" id="avatar"></div>
            <div class="post-name" id="postName"></div>
            <span aria-hidden="true">···</span>
          </div>
          <div class="post-media">
            <div class="track" id="track"></div>
            <span class="badge" id="badge"></span>
            <button class="nav prev" id="prev" type="button" aria-label="이전 카드">‹</button>
            <button class="nav next" id="next" type="button" aria-label="다음 카드">›</button>
          </div>
          <div class="post-actions" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-3.3-6.5A8 8 0 0 1 20 12zm0 0l1 7-6-2"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 3L3 10l7 3 3 7 8-17zM10 13l5-5"/></svg>
            <div class="dots" id="dots"></div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-5-6 5z"/></svg>
          </div>
          <div class="post-caption clamp" id="postCaption"></div>
          <button class="more" id="more" type="button">더 보기</button>
          <div class="post-time">방금 전</div>
        </article>

        <div class="publish">
          <h3>게시 준비</h3>
          <p>카드 이미지와 캡션을 ZIP 하나로 저장하거나, 캡션만 복사해 바로 붙여넣을 수 있어요.</p>
          <div class="stat" id="statCards"></div>
          <div class="stat" id="statLen"></div>
          <div class="stat" id="statTags"></div>
          <button class="primary" id="saveSet" type="button">이미지 + 캡션 한번에 저장 (ZIP)</button>
          <button class="ghost" id="copyCaption" type="button">캡션 복사</button>
          <button class="ghost" id="downloadAll" type="button">이미지만 전체 저장</button>
          <p class="hint" id="publishMsg" role="status" style="margin:10px 0 0"></p>
        </div>
      </div>

      <div class="preview-head">
        <h2 id="count">카드별 저장</h2>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    const W = 1080;
    const PAD = 96;
    const FONT = "'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";

    const THEMES = [
      { name: '미드나잇', bg: ['#0f172a', '#1e293b'], text: '#f8fafc', sub: '#94a3b8', accent: '#38bdf8' },
      { name: '선셋', bg: ['#ff7e5f', '#feb47b'], text: '#ffffff', sub: '#fff1e6', accent: '#3b0764' },
      { name: '페이퍼', bg: ['#faf7f2', '#faf7f2'], text: '#1f2937', sub: '#6b7280', accent: '#e11d48' },
      { name: '포레스트', bg: ['#134e4a', '#065f46'], text: '#ecfdf5', sub: '#a7f3d0', accent: '#fbbf24' },
      { name: '라벤더', bg: ['#ede9fe', '#c4b5fd'], text: '#2e1065', sub: '#5b21b6', accent: '#7c3aed' },
      { name: '모노', bg: ['#000000', '#171717'], text: '#ffffff', sub: '#a3a3a3', accent: '#facc15' },
    ];

    const SAMPLE = `HTML이란?
웹 페이지의 뼈대를 만드는 마크업 언어입니다.
- 제목, 문단, 목록, 링크, 이미지 등 구조를 정의해요
- 태그는 꺾쇠 괄호 < > 로 작성합니다
- 브라우저가 HTML을 읽어 화면에 그려 줍니다

CSS란?
HTML로 만든 뼈대에 색, 글꼴, 여백, 배치 같은 디자인을 입히는 언어입니다.
- 선택자로 꾸밀 대상을 고르고
- 속성과 값으로 스타일을 지정해요

JavaScript란?
웹 페이지에 움직임과 상호작용을 더하는 프로그래밍 언어입니다. 버튼 클릭, 입력 확인, 데이터 불러오기처럼 사용자의 행동에 반응하는 기능을 만들 수 있어요.

세 가지를 함께 쓰면 완성!
HTML은 구조, CSS는 디자인, JavaScript는 동작을 담당합니다.`;

    const $ = (id) => document.getElementById(id);
    const state = { theme: 0, bgImage: null };
    const STORE_KEY = 'cardnews-draft';

    // ---------- 텍스트 줄바꿈 ----------
    function wrap(ctx, text, maxW) {
      const lines = [];
      for (const para of text.split('\n')) {
        if (!para.trim()) { lines.push(''); continue; }
        // 목록 항목은 이어지는 줄을 글머리 기호 뒤로 들여씀 ('\t'로 표시)
        const bullet = para.startsWith('• ');
        const indent = bullet ? ctx.measureText('• ').width : 0;
        const start = lines.length;
        let line = '';
        for (const word of para.split(' ')) {
          const maxW2 = lines.length > start ? maxW - indent : maxW;
          const test = line ? line + ' ' + word : word;
          if (ctx.measureText(test).width <= maxW2) { line = test; continue; }
          if (line) lines.push(line);
          if (ctx.measureText(word).width <= maxW - indent) { line = word; continue; }
          // 한 단어가 너무 길면 글자 단위로 자름
          line = '';
          for (const ch of word) {
            if (ctx.measureText(line + ch).width > maxW - indent) { lines.push(line); line = ch; }
            else line += ch;
          }
        }
        lines.push(line);
        if (bullet) for (let i = start + 1; i < lines.length; i++) lines[i] = '\t' + lines[i];
      }
      return lines;
    }

    // ---------- 본문 → 카드 데이터 ----------
    function parseBody(text) {
      return text.split(/\n\s*\n/).map((block) => block.trim()).filter(Boolean).map((block) => {
        const [heading, ...rest] = block.split('\n');
        const body = rest.map((l) => l.replace(/^\s*[-*•]\s+/, '• ')).join('\n');
        return { heading: heading.trim(), body };
      });
    }

    // ---------- 그리기 도우미 ----------
    function paintBackground(ctx, H, t) {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, t.bg[0]);
      g.addColorStop(1, t.bg[1]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function paintImage(ctx, H, img) {
      const s = Math.max(W / img.width, H / img.height);
      const w = img.width * s, h = img.height * s;
      ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, 'rgba(0,0,0,0.25)');
      g.addColorStop(1, 'rgba(0,0,0,0.8)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function drawLines(ctx, lines, x, y, lh, color, accent) {
      for (const line of lines) {
        if (line.startsWith('• ')) {
          ctx.fillStyle = accent;
          ctx.fillText('•', x, y);
          ctx.fillStyle = color;
          ctx.fillText(line.slice(2), x + ctx.measureText('• ').width, y);
        } else if (line.startsWith('\t')) {
          ctx.fillStyle = color;
          ctx.fillText(line.slice(1), x + ctx.measureText('• ').width, y);
        } else {
          ctx.fillStyle = color;
          ctx.fillText(line, x, y);
        }
        y += lh;
      }
      return y;
    }

    function drawHeader(ctx, brand, pageLabel, t) {
      ctx.textBaseline = 'top';
      ctx.font = `700 30px ${FONT}`;
      ctx.fillStyle = t.sub;
      ctx.textAlign = 'left';
      ctx.fillText(brand, PAD, PAD - 20);
      if (pageLabel) {
        ctx.textAlign = 'right';
        ctx.fillText(pageLabel, W - PAD, PAD - 20);
        ctx.textAlign = 'left';
      }
    }

    function drawProgress(ctx, H, index, total, t) {
      if (total < 2) return;
      const gap = 10, barH = 6;
      const barW = Math.min(60, (W - PAD * 2 - gap * (total - 1)) / total);
      let x = PAD;
      const y = H - PAD + 20;
      for (let i = 0; i < total; i++) {
        ctx.fillStyle = i === index ? t.accent : t.sub;
        ctx.globalAlpha = i === index ? 1 : 0.35;
        ctx.fillRect(x, y, barW, barH);
        x += barW + gap;
      }
      ctx.globalAlpha = 1;
    }

    // ---------- 카드 레이아웃 ----------
    function layoutContent(ctx, H, scale, card) {
      // 본문이 한 장에 넘치면 여러 장으로 나눔
      const maxW = W - PAD * 2;
      ctx.font = `900 ${Math.round(68 * scale)}px ${FONT}`;
      const headLines = wrap(ctx, card.heading, maxW);
      const headLH = Math.round(68 * scale * 1.3);
      ctx.font = `400 ${Math.round(40 * scale)}px ${FONT}`;
      const bodyLH = Math.round(40 * scale * 1.7);
      const bodyLines = card.body ? wrap(ctx, card.body, maxW) : [];

      const top = PAD + 140 + Math.round(90 * scale);
      const bodyTop = top + headLines.length * headLH + 60;
      const bottom = H - PAD - 60;
      const perPage = Math.max(1, Math.floor((bottom - bodyTop) / bodyLH));

      if (bodyLines.length <= perPage) return [{ ...card, headLines, bodyLines, headLH, bodyLH }];
      const pages = [];
      for (let i = 0; i < bodyLines.length; i += perPage) {
        const chunk = bodyLines.slice(i, i + perPage);
        while (chunk.length && !chunk[0]) chunk.shift();
        if (chunk.length) pages.push({ ...card, headLines, bodyLines: chunk, headLH, bodyLH, cont: i > 0 });
      }
      return pages;
    }

    function drawCover(ctx, H, scale, d, t) {
      const onImage = !!state.bgImage;
      onImage ? paintImage(ctx, H, state.bgImage) : paintBackground(ctx, H, t);
      const text = onImage ? '#ffffff' : t.text;
      const sub = onImage ? 'rgba(255,255,255,0.8)' : t.sub;
      drawHeader(ctx, d.brand, '', { ...t, sub });

      const maxW = W - PAD * 2;
      ctx.textBaseline = 'top';
      ctx.font = `900 ${Math.round(96 * scale)}px ${FONT}`;
      const titleLines = wrap(ctx, d.title, maxW);
      const titleLH = Math.round(96 * scale * 1.25);
      ctx.font = `400 ${Math.round(40 * scale)}px ${FONT}`;
      const subLines = d.subtitle ? wrap(ctx, d.subtitle, maxW) : [];
      const subLH = Math.round(40 * scale * 1.5);

      const blockH = 16 + 50 + titleLines.length * titleLH + (subLines.length ? 40 + subLines.length * subLH : 0);
      let y = onImage ? H - PAD - 110 - blockH : (H - blockH) / 2;

      ctx.fillStyle = t.accent;
      ctx.fillRect(PAD, y, 90, 16);
      y += 66;
      ctx.font = `900 ${Math.round(96 * scale)}px ${FONT}`;
      y = drawLines(ctx, titleLines, PAD, y, titleLH, text, t.accent);
      if (subLines.length) {
        y += 40;
        ctx.font = `400 ${Math.round(40 * scale)}px ${FONT}`;
        drawLines(ctx, subLines, PAD, y, subLH, sub, t.accent);
      }

      ctx.font = `700 30px ${FONT}`;
      ctx.fillStyle = sub;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('밀어서 보기  →', W - PAD, H - PAD + 20);
      ctx.textAlign = 'left';
    }

    function drawContent(ctx, H, scale, p, d, t, num, index, total) {
      paintBackground(ctx, H, t);
      drawHeader(ctx, d.brand, `${String(index + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`, t);

      let y = PAD + 140;
      ctx.textBaseline = 'top';
      ctx.font = `900 ${Math.round(72 * scale)}px ${FONT}`;
      ctx.fillStyle = t.accent;
      ctx.fillText(String(num).padStart(2, '0') + (p.cont ? '  ·  계속' : ''), PAD, y);
      y += Math.round(90 * scale);

      ctx.font = `900 ${Math.round(68 * scale)}px ${FONT}`;
      y = drawLines(ctx, p.headLines, PAD, y, p.headLH, t.text, t.accent);

      if (p.bodyLines.length) {
        y += 20;
        ctx.fillStyle = t.accent;
        ctx.fillRect(PAD, y, 60, 6);
        y += 40;
        ctx.font = `400 ${Math.round(40 * scale)}px ${FONT}`;
        drawLines(ctx, p.bodyLines, PAD, y, p.bodyLH, t.text, t.accent);
      }
      drawProgress(ctx, H, index, total, t);
    }

    function drawEnd(ctx, H, scale, d, t, index, total) {
      paintBackground(ctx, H, t);
      drawHeader(ctx, d.brand, `${String(index + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`, t);

      const maxW = W - PAD * 2;
      ctx.textBaseline = 'top';
      ctx.textAlign = 'center';
      ctx.font = `900 ${Math.round(72 * scale)}px ${FONT}`;
      const lines = wrap(ctx, d.cta, maxW);
      const lh = Math.round(72 * scale * 1.35);
      let y = (H - lines.length * lh - 220) / 2;
      ctx.fillStyle = t.text;
      for (const l of lines) { ctx.fillText(l, W / 2, y); y += lh; }

      y += 70;
      ctx.font = `700 34px ${FONT}`;
      const pills = ['저장', '공유', '팔로우'];
      const pw = 190, ph = 76, gap = 24;
      let x = (W - (pw * 3 + gap * 2)) / 2;
      for (const label of pills) {
        ctx.fillStyle = t.accent;
        roundRect(ctx, x, y, pw, ph, ph / 2);
        ctx.fill();
        ctx.fillStyle = t.bg[0];
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x + pw / 2, y + ph / 2 + 2);
        x += pw + gap;
      }
      ctx.textBaseline = 'top';
      ctx.font = `700 40px ${FONT}`;
      ctx.fillStyle = t.sub;
      ctx.fillText(d.brand, W / 2, y + ph + 60);
      ctx.textAlign = 'left';
      drawProgress(ctx, H, index, total, t);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---------- 전체 생성 ----------
    function readInputs() {
      return {
        brand: $('brand').value.trim(),
        title: $('title').value.trim() || '제목을 입력하세요',
        subtitle: $('subtitle').value.trim(),
        body: $('body').value,
        cta: $('cta').value.trim() || '읽어 주셔서 감사합니다',
        H: Number($('ratio').value),
        scale: Number($('size').value),
        cover: $('showCover').checked,
        end: $('showEnd').checked,
      };
    }

    function generate() {
      const d = readInputs();
      const t = THEMES[state.theme];
      const measure = document.createElement('canvas').getContext('2d');

      const pages = [];
      if (d.cover) pages.push({ type: 'cover' });
      parseBody(d.body).forEach((card, i) => {
        for (const p of layoutContent(measure, d.H, d.scale, card)) pages.push({ type: 'content', num: i + 1, p });
      });
      if (d.end) pages.push({ type: 'end' });

      const grid = $('grid');
      grid.innerHTML = '';
      const canvases = [];
      pages.forEach((page, i) => {
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = d.H;
        const ctx = canvas.getContext('2d');
        if (page.type === 'cover') drawCover(ctx, d.H, d.scale, d, t);
        else if (page.type === 'end') drawEnd(ctx, d.H, d.scale, d, t, i, pages.length);
        else drawContent(ctx, d.H, d.scale, page.p, d, t, page.num, i, pages.length);
        canvases.push(canvas);

        const card = document.createElement('div');
        card.className = 'card';
        card.appendChild(canvas);
        const foot = document.createElement('div');
        foot.className = 'card-foot';
        foot.innerHTML = `<span>${i + 1}번 카드</span>`;
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.type = 'button';
        btn.textContent = 'PNG 저장';
        btn.onclick = () => download(canvas, i + 1);
        foot.appendChild(btn);
        card.appendChild(foot);
        grid.appendChild(card);
      });
      $('count').textContent = `카드별 저장 · 총 ${pages.length}장`;
      state.canvases = canvases;
      renderPost(d, t);
      save();
    }

    function download(canvas, n) {
      const a = document.createElement('a');
      a.download = `cardnews_${String(n).padStart(2, '0')}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    // ---------- 게시물 미리보기 ----------
    const CAPTION_MAX = 2200;
    const TAG_MAX = 30;
    let slide = 0;

    function renderPost(d, t) {
      const name = (d.brand || 'my_account').replace(/^@/, '');
      $('postName').textContent = name;
      $('avatar').textContent = name.charAt(0).toUpperCase();
      $('avatar').style.background = `linear-gradient(135deg, ${t.bg[0]}, ${t.accent})`;

      // 미리보기용은 절반 해상도로 복사
      const track = $('track');
      track.innerHTML = '';
      for (const src of state.canvases) {
        const c = document.createElement('canvas');
        c.width = W / 2;
        c.height = src.height / 2;
        c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
        track.appendChild(c);
      }
      $('dots').innerHTML = state.canvases.map(() => '<span></span>').join('');
      slide = Math.min(slide, state.canvases.length - 1);
      track.scrollLeft = slide * track.clientWidth;
      updateSlide();
      renderCaption();
    }

    function updateSlide() {
      const n = state.canvases.length;
      $('badge').textContent = `${slide + 1}/${n}`;
      $('prev').disabled = slide <= 0;
      $('next').disabled = slide >= n - 1;
      [...$('dots').children].forEach((dot, i) => dot.classList.toggle('on', i === slide));
      $('statCards').textContent = `카드 ${n}장` + (n > 20 ? ' · 한 게시물은 최대 20장까지 올릴 수 있어요' : '');
      $('statCards').classList.toggle('warn', n > 20);
    }

    function goTo(i) {
      const track = $('track');
      track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
    }

    const escapeHtml = (str) => str.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const countTags = (str) => (str.match(/#[^\s#]+/g) || []).length;

    function renderCaption() {
      const caption = $('caption').value.trim();
      const name = ($('brand').value.trim() || 'my_account').replace(/^@/, '');
      const body = escapeHtml(caption).replace(/#[^\s#]+/g, (tag) => `<span class="tag">${tag}</span>`);
      const box = $('postCaption');
      box.innerHTML = `<b>${escapeHtml(name)}</b> ${body || '<span style="color:var(--muted)">캡션을 입력하세요</span>'}`;
      box.classList.add('clamp');
      $('more').hidden = box.scrollHeight <= box.clientHeight + 1;

      const len = [...caption].length;
      const tags = countTags(caption);
      $('statLen').textContent = `캡션 ${len.toLocaleString()} / ${CAPTION_MAX.toLocaleString()}자`;
      $('statLen').classList.toggle('warn', len > CAPTION_MAX);
      $('statTags').textContent = `해시태그 ${tags} / ${TAG_MAX}개`;
      $('statTags').classList.toggle('warn', tags > TAG_MAX);
    }

    // 카드 내용으로 기본 캡션을 만듦 (AI 없이 쓸 때)
    function buildCaption() {
      const d = readInputs();
      const points = parseBody(d.body).map((c) => `✔ ${c.heading}`);
      const lines = [d.title];
      if (d.subtitle) lines.push(d.subtitle);
      if (points.length) lines.push('', ...points);
      lines.push('', d.cta, '', '#카드뉴스 #정보공유 #오늘의정보');
      return lines.join('\n');
    }

    $('track').addEventListener('scroll', () => {
      const track = $('track');
      const i = Math.round(track.scrollLeft / track.clientWidth);
      if (i !== slide) { slide = i; updateSlide(); }
    });
    $('prev').onclick = () => goTo(slide - 1);
    $('next').onclick = () => goTo(slide + 1);
    $('more').onclick = () => { $('postCaption').classList.remove('clamp'); $('more').hidden = true; };
    $('caption').addEventListener('input', () => { renderCaption(); save(); });
    $('autoCaption').onclick = () => { $('caption').value = buildCaption(); renderCaption(); save(); };

    $('copyCaption').onclick = async () => {
      const ok = await copyText($('caption').value.trim());
      $('publishMsg').textContent = ok ? '캡션을 복사했어요.' : '복사에 실패했어요. 브라우저의 클립보드 권한을 확인해 주세요.';
    };

    const toBlob = (canvas) => new Promise((r) => canvas.toBlob(r, 'image/png'));

    $('saveSet').onclick = async () => {
      const msg = $('publishMsg');
      if (!window.JSZip) {
        msg.textContent = 'ZIP 도구를 불러오지 못해 파일을 하나씩 저장합니다.';
        await downloadAllPng();
        downloadBlob(new Blob([$('caption').value.trim()], { type: 'text/plain' }), 'caption.txt');
        return;
      }
      msg.textContent = 'ZIP 파일을 만드는 중…';
      const zip = new JSZip();
      for (let i = 0; i < state.canvases.length; i++) {
        zip.file(`cardnews_${String(i + 1).padStart(2, '0')}.png`, await toBlob(state.canvases[i]));
      }
      zip.file('caption.txt', $('caption').value.trim());
      // 한글 파일명은 일부 브라우저에서 무시되므로 날짜로 이름을 붙임
      const stamp = new Date().toISOString().slice(0, 16).replace(/[-:]/g, '').replace('T', '_');
      downloadBlob(await zip.generateAsync({ type: 'blob' }), `cardnews_${stamp}.zip`);
      msg.textContent = `카드 ${state.canvases.length}장과 caption.txt를 ZIP으로 저장했어요.`;
    };

    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      a.download = filename;
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    // ---------- AI 원고 프롬프트 ----------
    // cardnews-prompt.md 와 같은 내용. 한쪽을 고치면 다른 쪽도 맞춰 주세요.
    function buildPrompt() {
      const topic = $('aiTopic').value.trim() || '(주제를 입력하세요)';
      const audience = $('aiAudience').value.trim() || '일반 독자';
      const count = $('aiCount').value;
      const tone = $('aiTone').value;
      const source = $('aiSource').value.trim();
      return `당신은 인스타그램 카드뉴스를 전문으로 만드는 콘텐츠 에디터입니다.
아래 조건에 맞춰 카드뉴스 원고를 작성하세요.

# 조건
- 주제: ${topic}
- 대상 독자: ${audience}
- 말투: ${tone}
- 내용 카드 수: ${count}장 (표지와 마무리 카드는 제외)

# 작성 원칙
1. 표지 제목은 25자 이내. 숫자나 질문을 활용해 넘겨 보고 싶게 만들되, 과장이나 낚시성 표현은 쓰지 마세요.
2. 표지 부제는 30자 이내로, 이 카드뉴스를 보면 무엇을 얻는지 알려 주세요.
3. 내용 카드 한 장에는 메시지 하나만 담으세요.
   - 소제목: 20자 이내, 그 카드의 핵심을 한 줄로
   - 본문: 2~5줄, 한 줄은 35자 이내
   - 나열할 때는 줄 앞에 "- "를 붙인 목록으로 (카드당 최대 4개)
4. 흐름: 첫 내용 카드는 독자가 공감할 문제나 궁금증으로 시작하고, 마지막 내용 카드는 핵심을 요약하세요.
5. 전문 용어는 처음 나올 때 쉬운 말로 풀어 주세요.
6. 확실하지 않은 사실은 단정하지 마세요. 수치와 통계는 참고 자료에 있는 것만 쓰고, 없으면 쓰지 마세요.
7. 이모지, 해시태그, 마크다운 기호(**, #, >)는 원고 안에 쓰지 마세요.
8. 마무리 문구는 30자 이내로 저장·공유·팔로우 같은 행동을 자연스럽게 권하세요.

# 출력 형식
아래 형식을 정확히 지키고, 형식 앞뒤에 설명이나 인사말을 붙이지 마세요.
내용 카드 사이는 빈 줄 하나로 구분하고, 카드 안에서는 빈 줄을 쓰지 마세요.

[표지 제목]
(표지 제목)

[표지 부제]
(표지 부제)

[본문]
(1번 카드 소제목)
(1번 카드 본문)
- (목록 항목)

(2번 카드 소제목)
(2번 카드 본문)

[마무리 문구]
(마무리 문구)

[게시글 캡션]
(게시글에 함께 올릴 3~4줄 캡션과 해시태그 5개)

# 참고 자료
${source || '없음. 일반적으로 널리 알려진 내용만 사용하세요.'}`;
    }

    // AI 답변에서 [섹션]별 내용을 뽑아 입력칸에 채움
    function parseResult(text) {
      const sections = {};
      let key = null;
      for (const line of text.replace(/\r/g, '').split('\n')) {
        const m = line.trim().match(/^\**\[(.+?)\]\**$/);
        if (m) { key = m[1].trim(); sections[key] = []; continue; }
        if (key) sections[key].push(line);
      }
      const get = (k) => (sections[k] || []).join('\n').trim();
      return { title: get('표지 제목'), subtitle: get('표지 부제'), body: get('본문'), cta: get('마무리 문구'), caption: get('게시글 캡션') };
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      }
    }

    $('copyPrompt').onclick = async () => {
      const ok = await copyText(buildPrompt());
      $('aiMsg').textContent = ok
        ? '프롬프트를 복사했어요. AI 채팅창에 붙여넣으세요.'
        : '복사에 실패했어요. 브라우저의 클립보드 권한을 확인해 주세요.';
    };

    $('applyResult').onclick = () => {
      const r = parseResult($('aiResult').value);
      if (!r.body) {
        $('aiMsg').textContent = '[본문] 섹션을 찾지 못했어요. 답변 전체를 붙여넣었는지 확인해 주세요.';
        return;
      }
      if (r.title) $('title').value = r.title;
      if (r.subtitle) $('subtitle').value = r.subtitle;
      if (r.cta) $('cta').value = r.cta;
      if (r.caption) $('caption').value = r.caption;
      // 카드 안의 빈 줄 대신 카드 사이만 빈 줄 하나로 정리
      $('body').value = r.body.replace(/\n{3,}/g, '\n\n');
      generate();
      $('aiMsg').textContent = r.caption
        ? '카드와 게시글 캡션에 적용했어요. 오른쪽 게시물 미리보기를 확인하세요.'
        : '카드에 적용했어요. 캡션은 "카드 내용으로 캡션 자동 작성"으로 만들 수 있어요.';
    };

    // ---------- 임시 저장 ----------
    const FIELDS = ['brand', 'title', 'subtitle', 'body', 'cta', 'caption', 'ratio', 'size'];
    function save() {
      try {
        const data = { theme: state.theme };
        FIELDS.forEach((f) => (data[f] = $(f).value));
        localStorage.setItem(STORE_KEY, JSON.stringify(data));
      } catch (e) { /* 저장 불가 환경은 무시 */ }
    }
    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORE_KEY));
        if (!data) return false;
        FIELDS.forEach((f) => { if (data[f] != null) $(f).value = data[f]; });
        if (THEMES[data.theme]) state.theme = data.theme;
        return true;
      } catch (e) { return false; }
    }

    // ---------- 이벤트 ----------
    let timer;
    const schedule = () => { clearTimeout(timer); timer = setTimeout(generate, 150); };

    function renderThemeButtons() {
      const box = $('themes');
      box.innerHTML = '';
      THEMES.forEach((t, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'theme-btn';
        b.title = t.name;
        b.setAttribute('aria-label', t.name);
        b.setAttribute('aria-pressed', i === state.theme);
        b.style.background = `linear-gradient(135deg, ${t.bg[0]} 50%, ${t.accent} 50%)`;
        b.onclick = () => { state.theme = i; renderThemeButtons(); generate(); };
        box.appendChild(b);
      });
    }

    document.querySelectorAll('input, textarea, select').forEach((el) => {
      if (el.type !== 'file' && el.id !== 'caption' && !el.closest('#ai')) el.addEventListener('input', schedule);
    });

    $('bgimg').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => { state.bgImage = img; generate(); };
      img.src = URL.createObjectURL(file);
    });
    $('clearImg').onclick = () => { state.bgImage = null; $('bgimg').value = ''; generate(); };
    $('sample').onclick = () => { $('body').value = SAMPLE; generate(); };
    async function downloadAllPng() {
      for (let i = 0; i < state.canvases.length; i++) {
        download(state.canvases[i], i + 1);
        await new Promise((r) => setTimeout(r, 300));
      }
    }
    $('downloadAll').onclick = downloadAllPng;

    if (!load()) $('body').value = SAMPLE;
    if (!$('caption').value) $('caption').value = buildCaption();
    renderThemeButtons();
    generate();
    // 웹폰트가 로드되면 다시 그림
    document.fonts.load(`900 40px 'Noto Sans KR'`).then(() => document.fonts.ready).then(generate).catch(() => {});
  </script>
</body>
</html>
